name: Gerar APK Android (MedDia)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17 (para Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Capacitor e criar plataforma Android
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Compilar arquivo APK (assembleDebug)
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: MedDia-Instalador-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
