name: Gerar APK Android (MedDia)

on:
  push:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Montar Projeto e Compilar APK
        run: |
          set -e
          mkdir -p /tmp/meddia-apk/www
          cd /tmp/meddia-apk

          python3 - << 'EOF'
          import base64, gzip, json

          b64_data = ""
          html = gzip.decompress(base64.b64decode(b64_data)).decode('utf-8')
          with open('www/index.html', 'w', encoding='utf-8') as f:
              f.write(html)

          pkg = {
              "name": "meddia-app",
              "version": "1.0.0",
              "private": True,
              "dependencies": {
                  "@capacitor/android": "^6.0.0",
                  "@capacitor/core": "^6.0.0"
              },
              "devDependencies": {
                  "@capacitor/cli": "^6.0.0"
              }
          }
          with open('package.json', 'w', encoding='utf-8') as f:
              json.dump(pkg, f, indent=2)

          cap = {
              "appId": "com.meddia.controle",
              "appName": "MedDia",
              "webDir": "www"
          }
          with open('capacitor.config.json', 'w', encoding='utf-8') as f:
              json.dump(cap, f, indent=2)
          EOF

          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/MedDia.apk"

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: MedDia-Instalador-APK
          path: MedDia.apk
